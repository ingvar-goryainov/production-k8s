apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: training-access
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ingvar-goryainov/production-k8s.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
