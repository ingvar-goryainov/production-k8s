apiVersion: v1
kind: ConfigMap
metadata:
  name: readonly-rootfs-audit-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  readonly-rootfs-audit.json: |
    {
      "uid": "readonly-rootfs-audit",
      "title": "Kyverno / Read-only Root Filesystem Audit",
      "tags": [
        "kyverno",
        "security"
      ],
      "timezone": "browser",
      "schemaVersion": 41,
      "editable": false,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Failed checks, all namespaces",
          "description": "require-readonly-rootfs failures reported by Kyverno (admission and background scans).",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({job=\"loki.source.kubernetes_events\"} |= \"PolicyViolation\" |= \"require-readonly-rootfs\" | logfmt | kind=\"Pod\" [$__range]))",
              "queryType": "instant",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Failed checks, student and mentor namespaces",
          "description": "Failures in the namespaces covered by the Telegram alert.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({job=\"loki.source.kubernetes_events\", namespace=~\"mentor|student.+\"} |= \"PolicyViolation\" |= \"require-readonly-rootfs\" | logfmt | kind=\"Pod\" [$__range]))",
              "queryType": "instant",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Failing pods, all namespaces",
          "description": "Distinct pods that failed the check in the selected range.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(sum by (namespace, name) (count_over_time({job=\"loki.source.kubernetes_events\"} |= \"PolicyViolation\" |= \"require-readonly-rootfs\" | logfmt | kind=\"Pod\" [$__range])))",
              "queryType": "instant",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Failing pods, student and mentor namespaces",
          "description": "Distinct pods in alert scope that failed the check in the selected range.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(sum by (namespace, name) (count_over_time({job=\"loki.source.kubernetes_events\", namespace=~\"mentor|student.+\"} |= \"PolicyViolation\" |= \"require-readonly-rootfs\" | logfmt | kind=\"Pod\" [$__range])))",
              "queryType": "instant",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Failed checks by namespace",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (count_over_time({job=\"loki.source.kubernetes_events\"} |= \"PolicyViolation\" |= \"require-readonly-rootfs\" | logfmt | kind=\"Pod\" [$__auto]))",
              "legendFormat": "{{namespace}}",
              "queryType": "range",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 6,
          "type": "table",
          "title": "Failing pods",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace, name) (count_over_time({job=\"loki.source.kubernetes_events\"} |= \"PolicyViolation\" |= \"require-readonly-rootfs\" | logfmt | kind=\"Pod\" [$__range]))",
              "queryType": "instant",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "namespace": 0,
                  "name": 1,
                  "Value": 2
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "name": "Pod",
                  "Value": "Failed checks"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Failed checks",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          }
        },
        {
          "id": 7,
          "type": "logs",
          "title": "Kyverno PolicyViolation events",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 24,
            "h": 12
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{job=\"loki.source.kubernetes_events\"} |= \"PolicyViolation\" |= \"require-readonly-rootfs\" | logfmt | kind=\"Pod\" | line_format \"{{.namespace}}/{{.name}}: {{.msg}}\"",
              "queryType": "range",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          }
        }
      ]
    }
