apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-istio-sidecar
spec:
  validationActions:
    {{- toYaml .Values.istioSidecar.validationActions | nindent 4 }}
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    objectSelector:
      matchLabels:
        person: student
  validations:
    - expression: >-
        (object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : []))
        .exists(c, c.name == 'istio-proxy')
      message: >-
        Pods labeled person=student must run with the Istio sidecar
        (istio-proxy container).
